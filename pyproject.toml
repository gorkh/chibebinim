[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chibebinim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram[proxy]>=3.20,<4",
  "SQLAlchemy[asyncio]>=2.0.40,<3",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["catalog.json", "tmdb-logo.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
